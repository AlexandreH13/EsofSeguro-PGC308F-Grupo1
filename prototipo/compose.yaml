services:
  # A aplicação. A construção da imagem compila e roda os testes (ver Dockerfile).
  transcricao:
    build: .
    ports:
      - "${PORTA:-8080}:8080"

  # Só os testes, com a saída completa: docker compose run --rm testes
  testes:
    image: maven:3.9-eclipse-temurin-21
    profiles: ["testes"]
    working_dir: /app
    volumes:
      - .:/app
      - maven-cache:/root/.m2
    command: mvn -B test

  # Verificação de vulnerabilidades da Etapa 5 com o ZAP: docker compose run --rm zap
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    profiles: ["verificacao"]
    depends_on:
      - transcricao
    volumes:
      - ./zap:/zap/wrk:ro
      - ../evidencias/etapa-5:/zap/relatorios
    command: python3 /zap/wrk/sessao.py

volumes:
  maven-cache:

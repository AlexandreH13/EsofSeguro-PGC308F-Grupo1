<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat com a IA</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="screen">
  <div class="header">
    <div class="row" style="gap:40px">
      <div class="brand">Transcrição de Mídias</div>
      <nav><a href="transcricoes.html">Minhas transcrições</a></nav>
    </div>
    <div class="user"><span data-usuario></span> <a href="#" data-sair>Sair</a></div>
  </div>
  <main class="content">
    <div class="crumb"><a href="transcricoes.html">Minhas transcrições</a> <span aria-hidden="true">›</span> <a id="voltar-transcricao">Transcrição</a> <span aria-hidden="true">›</span> Chat com a IA</div>
    <div id="estado-chat" class="callout" role="status">Abrindo chat...</div>
    <div id="area-chat" class="sidebar-layout" hidden>
      <section class="main">
        <div class="chat-box">
          <div class="chat" id="mensagens" aria-live="polite"></div>
          <form class="composer" id="form-pergunta">
            <label class="visually-hidden" for="pergunta">Pergunta sobre a transcrição</label>
            <input id="pergunta" class="input block" maxlength="4000" placeholder="Pergunte algo sobre esta transcrição" required>
            <button id="enviar-pergunta" class="btn" type="submit">Enviar</button>
          </form>
        </div>
      </section>
      <aside class="side">
        <div class="card">
          <div class="group-title" style="margin-top:0">Contexto do chat</div>
          <p><strong id="chat-midia"></strong></p>
          <p id="chat-processo" class="muted"></p>
          <p class="muted">A conversa é temporária e não fica salva.</p>
          <button class="btn danger block" id="encerrar-chat" type="button">Encerrar chat</button>
        </div>
      </aside>
    </div>
  </main>
</div>
<script src="app.js"></script>
<script>
  exigirSessao();
  montarCabecalho();
  inicializarChat();
</script>
</body>
</html>

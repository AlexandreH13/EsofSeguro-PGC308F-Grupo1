<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transcrição</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div class="screen">
  <div class="header">
    <div class="row" style="gap:40px">
      <div class="brand">Transcrição de Mídias</div>
      <nav><a class="active" href="transcricoes.html">Minhas transcrições</a></nav>
    </div>
    <div class="user"><span data-usuario></span> <a href="#" data-sair>Sair</a></div>
  </div>
  <main class="content">
    <div class="crumb"><a href="transcricoes.html">Minhas transcrições</a> <span aria-hidden="true">›</span> <span id="processo-crumb">Carregando...</span> <span aria-hidden="true">›</span> <span id="midia-crumb"></span></div>
    <div id="estado-transcricao" class="callout" role="status">Carregando transcrição...</div>
    <section id="detalhe-transcricao" hidden>
      <div class="row between detail-heading">
        <div>
          <h1><span id="titulo-midia"></span> <span id="status-transcricao"></span></h1>
          <p id="metadados-transcricao" class="muted"></p>
        </div>
        <div class="row detail-actions">
          <button class="btn secondary" id="baixar-docx" type="button">Baixar .docx</button>
          <button class="btn" id="abrir-chat" type="button">Perguntar à IA</button>
        </div>
      </div>
      <div id="texto-transcricao" class="transcript" style="margin-top:16px" aria-label="Texto da transcrição"></div>
    </section>
  </main>
</div>
<script src="app.js"></script>
<script>
  exigirSessao();
  montarCabecalho();
  inicializarDetalheTranscricao();
</script>
</body>
</html>

spring.application.name=transcricao
spring.datasource.url=jdbc:h2:mem:transcricao;DB_CLOSE_DELAY=-1
spring.jpa.open-in-view=false

# Provedor de identidade esperado pelo Backend (RS02)
idp.emissor=https://idp.mp.exemplo.gov.br
idp.audiencia=servico-transcricao
# Chave publica do provedor real em base64 (X.509 DER). Vazia, o Backend usa a chave do IdP fake.
idp.chave-publica=
# IdP fake para demonstracao: emite tokens com ou sem segundo fator em /idp-fake. Nunca ativar em producao.
idp.fake=true
